      <p class="help">${t.redrawn ? `Losovalo se znovu (${t.redrawn}×) – zásobník nesplňoval podmínku samohlásek a souhlásek. ` : ''}Týmy mohou zkoušet slova v mobilu, až se spustí čas.</p>`;
    next = 'Spustit čas →';
  } else if (t.phase === 'think' || t.phase === 'check') {
    const think = t.phase === 'think';
    html = `${stepsHtml(t.phase)}
      <h3>${think ? 'Týmy přemýšlejí' : 'Kontrola řešení'} ${keyTip([['<kbd>↑</kbd> <kbd>↓</kbd>', 'tým'], ['<kbd>←</kbd> <kbd>→</kbd>', 'řešení týmu'],
        ['<kbd>mezerník</kbd>', 'dokola čeká → ✓ uznat → ⚠ váhám → ✕ neuznat'], ['<kbd>Esc</kbd>', '⚠ váhám – tým to hned vidí'], ['<kbd>Delete</kbd>', 'neuznat – signál týmu „hledejte dál“, rozhodne se při odhalování'],
        ['<kbd>+</kbd>', think ? 'přidat minutu' : 'ještě minutu (znovu otevře čas)'], ...(think ? [['<kbd>P</kbd>', 'pozastavit / pokračovat']] : []),
        ['<kbd>Enter</kbd>', think ? 'ukončit čas' : 'odhalovat tahy']])}</h3>
      ${think ? `<div class="clockline">${t.paused != null ? `<span class="big paused">${fmtTime(t.paused)}</span>`
          : `<span class="big" data-timer-end="${t.endsAt - (state.off || 0)}">${fmtTime(t.endsAt - now())}</span>`}
        <button class="btn small ${t.paused != null ? 'primary' : ''}" id="pause">${t.paused != null ? '▶ Pokračovat' : '⏸ Pozastavit'}</button>
        <span class="addtime">přidat ${ADD_TIMES.map(([s, l]) => `<button class="btn small" data-add="${s}">+${l}</button>`).join('')}</span></div>`
      : `<p class="sub">Týmy značky vidí hned, rozhoduje se až při odhalování.</p>
        <div class="clockline"><span class="addtime">Týmy ještě hrají – znovu otevřít čas ${ADD_TIMES.map(([s, l]) => `<button class="btn small" data-add="${s}">+${l}</button>`).join('')}</span></div>`}
      ${teamsTable(t)}${candDetail(t)}`;
    next = think ? 'Ukončit čas →' : 'Odhalovat tahy →';
  } else if (t.phase === 'reveal') {
    const nx = nextToReveal(t), shown = t.shown[t.shown.length - 1];
    html = `${stepsHtml('reveal')}
      <h3>Odhalování ${keyTip([['<kbd>Enter</kbd>', nx ? 'odhalit další tah (kurzor na něj skočí)' : 'položit nejlepší tah'], ['<kbd>↑</kbd> <kbd>↓</kbd>', 'tým'], ['<kbd>←</kbd> <kbd>→</kbd>', 'řešení týmu'],
        ['<kbd>mezerník</kbd>', 'dokola ✓ uznat → ⚠ váhám → ✕ neuznat'], ['<kbd>Esc</kbd>', '⚠ váhám – u tahu na plátně „posuzujeme“'], ['<kbd>Delete</kbd>', 'neuznat']])}</h3>
      <p class="sub">Tahy se odhalují od nejslabšího. ${shown ? `Na plátně: <b>${esc(findMove(t, shown)?.ev.pos)} ${esc(findMove(t, shown)?.ev.main)}</b>` : ''}
        ${!decidedShown(t) ? '<br><b style="color:var(--honey)">Nejdřív rozhodněte: ✓ uznat, nebo ✕ neuznat.</b>' : ''}</p>
      ${teamsTable(t)}${candDetail(t)}`;
    next = nx ? `Odhalit další tah →` : 'Položit nejlepší tah na desku →';
    nextOk = decidedShown(t);
  } else if (t.phase === 'placed') {
    html = `${stepsHtml('placed')}<h3>Na desce ${keyTip([['<kbd>Enter</kbd>', t.over ? 'stupně vítězů' : state.settings.rank ? 'pořadí' : 'další tah']])}</h3>
      <p class="sub">${t.placed ? `Položeno <b>${t.placed.pos} ${esc(t.placed.main)}</b> za ${t.placed.score} ${pw(t.placed.score)}.` : 'Nikdo nic nepoložil.'}
      ${t.over ? ' <b>Kameny došly – konec hry.</b>' : ''}</p>${teamsTable(t)}`;
    endBtn = !t.over;
    next = t.over ? 'Stupně vítězů →' : state.settings.rank ? 'Pořadí →' : 'Další tah – vylosovat →';
  } else if (t.phase === 'rank') {
    html = `${stepsHtml('rank')}<h3>Pořadí po ${t.no}. tahu ${keyTip([['<kbd>Enter</kbd>', 'další tah']])}</h3>
      <p class="sub">${!t.placed ? 'Nikdo nic nepoložil – další tah dostane úplně nový zásobník.' : 'Další tah doplní zásobník na 7 kamenů.'}</p>
      ${teamList()}`;
    endBtn = true;
    next = 'Další tah – vylosovat →';
  }
  const actions = `<div class="actions">${back}<span class="spacer"></span>
    ${endBtn ? '<button class="btn ghost" id="end-game">Ukončit hru → stupně vítězů</button>' : ''}
    <button class="btn primary" id="next" ${nextOk ? '' : 'disabled'}>${next}</button></div>`;
  el.innerHTML = html.includes('<!--ACTIONS-->') ? html.replace('<!--ACTIONS-->', actions.replace('class="actions"', 'class="actions dact"')) : html + actions;
  bindPhase(el, t);
}

function teamList() {
  const teams = state.teams;
  if (!teams.length) return '<p class="none">Zatím se nepřipojil žádný tým.</p>';
  return teams.map(team => `<div class="team-row">
      <span class="dot" style="background:${team.color}"></span>
      <input class="name-in" data-uid="${team.uid}" value="${esc(team.name)}" aria-label="Název týmu">
      <input class="note-in" data-note="${team.uid}" value="${esc(team.note || '')}" placeholder="poznámka – vidíte jen vy" aria-label="Interní poznámka k týmu">
      ${team.out ? '<span class="out-tag">vyřazen</span>' : '<span></span>'}
      <button class="team-del" data-uid="${team.uid}" title="${team.out ? 'Vrátit do hry' : 'Vyřadit tým'}">${team.out ? '↺' : '×'}</button>
    </div>`).join('');
}

function teamsTable(t) {
  const teams = active();
  if (!teams.length) return '<p class="none">Žádné týmy.</p>';
  const ck = curCand(t)?.e.key;   // stejný tah u jiných týmů = značka platí i pro ně
  return `<div>${teams.map((team, ri) => {
    const list = t.moves[team.uid] || [];
    const eff = teamMove(t, team.uid);
    const cells = list.map((c, ci) => {
      const e = evalCand(t, c), f = e.ok ? fl(t, team.uid, e.key) : null;
      const cls = [!e.ok ? 'bad' : '', f || '', eff?.idx === ci ? 'eff' : '', cursor.row === ri && cursor.col === ci ? 'cur' : ck && e.key === ck ? 'same' : ''].join(' ');
      return `<button class="cand ${cls}" data-r="${ri}" data-c="${ci}" title="${esc(e.ok ? e.words.map(w => `${w.w} ${w.s}`).join(', ') + (e.bingo ? ` + ${e.bingo}` : '') : e.err)}">
        <b>${ci + 1}.</b> ${esc(L.up(c.pos))} <span class="w">${esc(L.up(c.word))}</span><span class="s">${e.ok ? e.score : '–'}</span></button>`;
    }).join('');
    const pts = t.done ? t.pts[team.uid] ?? 0 : eff ? eff.score : '–';
    // odevzdané řešení týmu už uznané = tým posouzený, řádek zešedne
    const settled = finalPhase(t) && isSettled(t, team.uid);
    return `<div class="trow ${cursor.row === ri ? 'cur-row' : ''} ${settled ? 'settled' : ''}">
      <span class="dot" style="background:${team.color}"></span><span class="tn" title="${esc(team.note || '')}">${esc(team.name)}${team.note ? `<small>${esc(team.note)}</small>` : ''}</span>
      <div class="cands">${cells || '<span class="none">zatím nic</span>'}</div><span class="tot">${pts}</span></div>`;
  }).join('')}</div>`;
}

function curCand(t) {
  const team = active()[cursor.row];
  const c = (t.moves[team?.uid] || [])[cursor.col];
  return c ? { team, c, e: evalCand(t, c) } : null;
}
// využitá prémiová pole slova (jen pod nově položenými kameny) – štítky v barvách polí desky
const PREM_TXT = { DL: '2× písm.', TL: '3× písm.', DW: '2× slovo', TW: '3× slovo' };
function premTags(e, w) {
  const fresh = new Map(e.tiles.map(x => [x.i, x.t]));
  return (w.cells || []).filter(i => fresh.has(i) && L.PREM[i]).map(i => {
    // pole se souřadnicí – stejné pole ve dvou slovech pozná moderátor podle stejného označení
    const p = L.PREM[i], letter = p === 'DL' || p === 'TL' ? ` ${esc(L.up(fresh.get(i)))}` : '';
    return ` <span class="prem ${p}">${PREM_TXT[p]}${letter} · ${L.cellName(i)}</span>`;
  }).join('');
}
// slovo po písmenech; písmeno na prémiovém poli podtržené barvou toho pole
function wordHtml(t, e, w) {
  if (!w.cells) return esc(w.w);
  const fresh = new Map(e.tiles.map(x => [x.i, x.t])), board = L.boardFromStr(t.board0);
  return w.cells.map(i => {
    const ch = esc(L.up(fresh.get(i) ?? board[i]));
    return fresh.has(i) && L.PREM[i] ? `<u class="pu ${L.PREM[i]}">${ch}</u>` : ch;
  }).join('');
}
function candDetail(t) {
  const x = curCand(t);
  // <!--ACTIONS--> = místo pro tlačítka Zpět / dál: vpravo vedle spodku desky, ať nejsou mimo obrazovku
  // stavová tlačítka vždy nahoře na stejném místě (neposkakují podle počtu slov); bez platného řešení zašedlá
  const flags = (f, on) => `<div class="flags">${[['', 'Čeká'], ['ok', '✓ Uznat'], ['warn', '⚠ Váhám'], ['no', '✕ Neuznat']]
    .map(([v, l]) => `<button class="btn small flagbtn ${on && (f || '') === v ? 'on' : ''}" data-flag="${v}" ${on ? '' : 'disabled'}>${l}</button>`).join('')}</div>`;
  if (!x) return `<div class="detail"><div>${boardHtml(L.boardFromStr(t.board0), '300px')}</div><div class="dright">${flags(null, false)}<p class="help">Šipkami nebo klikem vyberte řešení týmu – ukáže se tady na desce.</p><!--ACTIONS--></div></div>`;
  const { team, c, e } = x;
  const f = e.ok ? fl(t, team.uid, e.key) : null;
  return `<div class="detail">
    <div>${boardHtml(L.boardFromStr(t.board0), '300px', e.ok ? { ghost: { tiles: e.tiles, color: team.color, rej: f === 'no' } } : {})}</div>
    <div class="dright">
      ${flags(f, e.ok)}
      <div style="margin-bottom:6px">${teamChip(team)}</div>
      <div><b>${esc(L.up(c.pos))}</b> <span class="w" style="font-family:var(--tile);font-weight:700">${esc(L.up(c.word))}</span></div>
      ${e.ok ? `<div class="words">${e.words.map(w => `<span class="w">${wordHtml(t, e, w)}</span> ${w.s}${premTags(e, w)}`).join('<br>')}${e.bingo ? `<br>všech 7 kamenů +${e.bingo}` : ''}<br><b>celkem ${e.score} ${pw(e.score)}</b></div>
        ${(() => { const o = active().filter(x => x !== team && (t.moves[x.uid] || []).some(c2 => evalCand(t, c2).key === e.key));
          return o.length ? `<div class="same-note">Stejný tah mají i ${o.map(x => teamChip(x)).join(' ')} – značka platí i pro ně.</div>` : ''; })()}`
      : `<div class="err">${esc(e.err)}</div>`}
      <!--ACTIONS--></div></div>`;
}

// mezerník dokola: uznat → ⚠ pochybnost → ✕ neuznat → uznat
// dokola: neposouzeno → ✓ uznáno → ⚠ pochybnost → ✕ neuznáno → neposouzeno
// při odhalování se „Čeká“ přeskakuje: uznat → váhám → neuznat → uznat
const cycleFlag = (f, t) => !f ? 'ok' : f === 'ok' ? 'warn' : f === 'warn' ? 'no' : t && t.phase === 'reveal' ? 'ok' : '';
function setFlag(t, key, val, toggle) {
  if (!key || t.done) return;
  if (!val || (toggle && t.flags[key] === val)) delete t.flags[key]; else t.flags[key] = val;
  commit();
}

function bindPhase(el, t) {
  const nextBtn = document.getElementById('next');
  nextBtn.onclick = () => { nextBtn.blur(); goNext(); };
  document.getElementById('back').onclick = e => { e.currentTarget.blur(); goBack(); };
  el.querySelectorAll('input.name-in').forEach(inp => {
    inp.onchange = () => {
      const team = teamBy(inp.dataset.uid), v = inp.value.trim();
      if (!team || !v) return;
      team.name = v;
      ScrabNet.set(state.code, `teams/${team.uid}`, { name: v, at: Date.now() });
      commit();
    };
    inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); inp.blur(); } };
  });
  // interní poznámka k týmu – jen v pultu (na plátno ani do mobilů nejde)
  el.querySelectorAll('input.note-in').forEach(inp => {
    inp.oninput = () => { const team = teamBy(inp.dataset.note); if (team) { team.note = inp.value; save(); } };
    inp.onkeydown = e => { if (e.key === 'Enter' || e.key === 'Escape') { e.preventDefault(); inp.blur(); } };
  });
  el.querySelectorAll('.team-del').forEach(b => b.onclick = () => {
    const team = teamBy(b.dataset.uid);
    if (!team) return;
    const played = state.turns.some(x => x.done && x.pts[team.uid] != null);
    if (team.out) team.out = false;
    else if (!played) {   // tým, který ještě nehrál, zmizí úplně
      if (!confirm(`Odebrat tým ${team.name}?`)) return;
      state.teams = state.teams.filter(x => x !== team);
      ScrabNet.set(state.code, `teams/${team.uid}`, null);
    } else {
      if (!confirm(`Vyřadit ${team.name} ze hry? Jeho body zůstanou.`)) return;
      team.out = true;
    }
    commit();
  });
  // klik na tým (mimo jeho slova) = přejít na tým
  el.querySelectorAll('.trow').forEach((row, ri) => row.onclick = ev => {
    if (ev.target.closest('.cand') || cursor.row === ri) return;
    cursor.row = ri; cursor.col = 0; cursor.uid = null; renderAll();
  });
  // klik vybere řešení; klik na už vybrané přepne stav jako mezerník
  el.querySelectorAll('.cand').forEach(b => b.onclick = () => {
    b.blur();
    if (cursor.row === +b.dataset.r && cursor.col === +b.dataset.c) {
      const x = curCand(t);
      if (x?.e.ok && !t.done) return setFlag(t, x.e.key, cycleFlag(t.flags[x.e.key], t));
    }
    cursor.row = +b.dataset.r; cursor.col = +b.dataset.c; cursor.uid = null; renderAll();
  });
  el.querySelectorAll('.flagbtn').forEach(b => b.onclick = () => { const x = curCand(t); b.blur(); if (x?.e.ok) setFlag(t, x.e.key, b.dataset.flag, true); });   // znovu klik = zpět na neposouzeno
  el.querySelectorAll('.vopt').forEach(b => b.onclick = () => { b.blur(); state.settings[b.dataset.opt] = !state.settings[b.dataset.opt]; commit(); });
  const pz = document.getElementById('pause');
  if (pz) pz.onclick = () => { pz.blur(); togglePause(t); };
  el.querySelectorAll('[data-add]').forEach(b => b.onclick = () => { b.blur(); addTime(t, +b.dataset.add); });
  const ti = document.getElementById('time-in');
  if (ti) {
    ti.onchange = () => { const v = parseFloat(String(ti.value).replace(',', '.')); if (v > 0) { state.settings.time = Math.round(Math.min(15, v) * 60); commit(); } };
    ti.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); ti.blur(); } };
  }
  const eg = document.getElementById('end-game');
  if (eg) eg.onclick = () => {
    if (!confirm('Ukončit hru a ukázat stupně vítězů?')) return;
    state.finalFrom = t.phase;
    state.phase = 'final'; state.revealed = 0; state.view = 'auto'; commit();
  };
  const ng = document.getElementById('new-game');   // v hlavičce vpravo nahoře jako v ostatních hrách
  if (ng) ng.onclick = () => { ng.blur(); newGame(true); };
}

function goNext() {
  const t = cur();
  // stupně vítězů: po odhalení všech míst další Enter = Přehled hry (statistiky)
  if (state.phase === 'final') {
    if (state.revealed < placing().places) { state.view = 'auto'; state.revealed++; }
    else if (state.view !== 'overview') { state.view = 'overview'; state.ovStep = 0; }
    else if (state.ovStep != null && state.ovStep < ovRecCount()) state.ovStep++;   // statistiky po řádcích
    return commit();
  }
  if (state.view !== 'auto') state.view = 'auto';
  if (state.phase === 'join') {
    if (!active().length) return;
    state.phase = 'game'; startTurn(); drawSounds(cur());
  } else if (state.phase === 'final') {
    if (state.revealed < placing().places) state.revealed++;
  } else if (t.phase === 'ready') {
    stopDrawSounds();
    t.phase = 'think'; t.paused = null; t.endsAt = now() + state.settings.time * 1000;
  } else if (t.phase === 'think') {
    if (timeLeft(t) > 1000 && !confirm('Čas ještě běží. Ukončit ho a začít kontrolu?')) return;
    closeThink(t); return;
  } else if (t.phase === 'check') {
    t.phase = 'reveal'; t.shown = [];
    const nx = nextToReveal(t); if (nx) { t.shown.push(nx.ev.key); cursorTo(t, nx.ev.key); }
  } else if (t.phase === 'reveal') {
    if (!decidedShown(t)) return;
    settleShown(t);
    const nx = nextToReveal(t);
    if (nx) { t.shown.push(nx.ev.key); cursorTo(t, nx.ev.key); } else { placeBest(t); placeSound(t); }
  } else if (t.phase === 'placed') {
    if (t.over) { state.finalFrom = 'placed'; state.phase = 'final'; state.revealed = 0; }
    else if (state.settings.rank) t.phase = 'rank';
    else { startTurn(); drawSounds(cur()); }   // pořadí vypnuté: rovnou další tah (tah zůstane „na desce“, Zpět se vrátí sem)
  } else if (t.phase === 'rank') {
    startTurn(); drawSounds(cur());
  }
  commit();
}
const ADD_TIMES = [[10, '10 s'], [20, '20 s'], [30, '30 s'], [60, '1 min'], [120, '2 min'], [300, '5 min']];
// při odhalování jde dál (Enter) až po rozhodnutí tahu na plátně: ✓ uznáno, nebo ✕ neuznáno
const decidedShown = t => { const k = t.shown[t.shown.length - 1]; return !k || t.flags[k] === 'ok' || t.flags[k] === 'no'; };
// Enter při odhalování za uznaným tahem: týmy, kterým ten tah platí, jsou vypořádané (řádek zešedne)
function settleShown(t) {
  const k = t.shown[t.shown.length - 1];
  if (!k || t.flags[k] !== 'ok') return;
  t.settled ||= {};
  active().forEach(team => { if (teamMove(t, team.uid)?.key === k) t.settled[team.uid] = k; });
}
// vypořádaný = Enterem odsouhlasený uznaný tah, který týmu pořád platí
const isSettled = (t, uid) => !!t.settled?.[uid] && t.flags[t.settled[uid]] === 'ok' && teamMove(t, uid)?.key === t.settled[uid];
// kurzor na řešení s daným klíčem (první tým, který ho má jako platný tah)
function cursorTo(t, key) {
  const teams = active();
  for (let r = 0; r < teams.length; r++) {
    const c = (t.moves[teams[r].uid] || []).findIndex(m => evalCand(t, m).key === key);
    if (c >= 0) { cursor.row = r; cursor.col = c; cursor.uid = null; return; }
  }
}
// přidat čas na tah – během přemýšlení se prodlouží, z kontroly se čas znovu otevře
function addTime(t, sec) {
  if (t.phase === 'think') { if (t.paused != null) t.paused += sec * 1000; else t.endsAt += sec * 1000; }
  else if (t.phase === 'check') { t.phase = 'think'; t.paused = null; t.endsAt = now() + sec * 1000; }
  else return;
  commit();
}
// pauza času: t.paused = zbývající ms (čas stojí), pokračování dopočítá nový konec
const timeLeft = t => t.paused != null ? t.paused : t.endsAt - now();
function togglePause(t) {
  if (t.phase !== 'think') return;
  if (t.paused != null) { t.endsAt = now() + t.paused; t.paused = null; }
  else t.paused = Math.max(0, t.endsAt - now());
  commit();
}
function closeThink(t) {
  gongSound(); copyMoves(t); t.phase = 'check'; t.endsAt = t.paused != null ? now() : Math.min(t.endsAt, now()); t.paused = null; commit(); }

function goBack() {
  const t = cur();
  if (state.phase === 'final' && state.view === 'overview' && state.ovStep > 0) state.ovStep--;   // skrýt poslední statistiku
  else if (state.phase === 'final' && state.view === 'overview') state.view = 'auto';   // z přehledu zpět na stupně
  else if (state.phase === 'final' && state.revealed > 0) state.revealed--;   // pódium: skrýt naposledy odhalené místo
  else if (state.phase === 'final') {   // zpět do hry tam, odkud se hra ukončila (ne na Pořadí, když se neukazuje)
    state.phase = 'game';
    t.phase = state.finalFrom === 'rank' && state.settings.rank ? 'rank' : 'placed';
  }
  else if (state.phase === 'join') return;
  else if (t.phase === 'ready') {
    // vylosovaný zásobník si zapamatovat – Enter pak vrátí stejný tah, ne nové losování
    if (!state.redo || 'no' in state.redo) state.redo = {};
    state.redo[t.no] = { board0: t.board0, bag0: t.bag0.join(','), bagAfter: state.bag, turn: t };
    state.bag = t.bag0; state.turns.pop();
    if (!state.turns.length) state.phase = 'join';
    else if (!state.settings.rank && cur().phase === 'rank') cur().phase = 'placed';   // pořadí se neukazuje → nevracet se na něj
  } else if (t.phase === 'think') { t.phase = 'ready'; t.endsAt = null; t.paused = null; }
  else if (t.phase === 'check') { t.phase = 'think'; t.paused = null; t.endsAt = now() + 60000; }   // omylem ukončený čas: ještě minuta
  else if (t.phase === 'reveal') {
    const k = t.shown.pop();
    for (const u in t.settled || {}) if (t.settled[u] === k) delete t.settled[u];   // vypořádání tím tahem se ruší
    if (!t.shown.length) t.phase = 'check';
  }
  else if (t.phase === 'placed') {
    state.board = L.boardFromStr(t.board0); t.placed = null; t.done = false; t.pts = {}; t.bingo = {}; t.top = 0; t.over = false; t.phase = 'reveal';
  } else if (t.phase === 'rank') t.phase = 'placed';
  commit();
}

function renderScore() {
  const el = document.getElementById('score-panel');
  const done = state.turns.filter(t => t.done);
  if (!done.length) { el.innerHTML = '<h3>Body</h3><p class="help">Body se ukážou po prvním tahu.</p>'; return; }
  const { s } = totals();
  const last = done[done.length - 1];
  el.innerHTML = `<h3>Body</h3>
    <table class="score"><thead><tr><th>Tým</th><th>poslední tah</th><th>celkem</th><th>% z nejlepších</th></tr></thead><tbody>
    ${placing().ranked.map(x => { const team = teamBy(x.uid); return `<tr><td><span class="dot" style="background:${team.color};width:10px;height:10px;margin-right:10px;vertical-align:-1px"></span>${esc(team.name)}</td>
      <td>${last.pts[x.uid] ?? 0}</td><td><b>${x.pts}</b></td><td>${pctStr(pctOf(x.uid))}</td></tr>`; }).join('')}
    </tbody></table>
    <div class="hist">${done.slice().reverse().map(t => `${t.no}. ${t.placed ? `${t.placed.pos} <span class="w">${esc(t.placed.main)}</span> ${t.placed.score}` : '– nikdo nic nepoložil'}`).join('<br>')}</div>`;
}

function renderSettings() {
  const el = document.getElementById('settings-panel');
  const st = state.settings;
  el.innerHTML = `<h3>Nastavení</h3>
    <div class="set-row"><label for="s-vc">Losovat aspoň 2 samohlásky a 2 souhlásky (od 16. tahu 1 + 1)</label><input type="checkbox" id="s-vc" ${st.vc ? 'checked' : ''}></div>
    <div class="set-row"><label for="s-bonus">Bonus za položení všech 7 kamenů</label><input class="num" id="s-bonus" type="number" min="0" max="200" value="${st.bonus}"></div>`;
  document.getElementById('s-vc').onchange = e => { st.vc = e.target.checked; e.target.blur(); commit(); };
  const b = document.getElementById('s-bonus');
  b.onchange = () => { st.bonus = Math.max(0, parseInt(b.value, 10) || 0); evalCache.clear(); commit(); };
  b.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); b.blur(); } };
}

async function newGame(keepTeams) {
  if (state.turns.length && !confirm('Opravdu začít novou hru? Body této hry se smažou, týmy zůstanou.')) return;
  const code = state.code, teams = state.teams.filter(t => !t.out).map(t => ({ ...t, out: false }));
  state = freshState(code, teams, state.settings);
  evalCache.clear();
  if (code) { await ScrabNet.set(code, 'moves', null); await ScrabNet.set(code, 'flags', null); }
  lastFlags = '';
  commit();
}

/* ================= Klávesy ================= */

document.addEventListener('keydown', e => {
  if (IS_PROJECTION || e.ctrlKey || e.altKey || e.metaKey) return;
  if (editing()) return;
  const t = cur();
  if (e.key === 'Enter') {
    e.preventDefault();
    const nb = document.getElementById('next');
    if (nb && !nb.disabled) nb.click();
    return;
  }
  // prototyp (jen Scrabble): Backspace = krok zpět, protějšek Enteru
  if (e.key === 'Backspace') {
    e.preventDefault();
    const bb = document.getElementById('back');
    if (bb && !bb.disabled) bb.click();
    return;
  }
  if (state.phase !== 'game' || !t) return;
  if (e.key === '+' && (t.phase === 'think' || t.phase === 'check')) { e.preventDefault(); addTime(t, 60); return; }
  if ((e.key === 'p' || e.key === 'P') && t.phase === 'think') { e.preventDefault(); togglePause(t); return; }
  const browse = ['think', 'check', 'reveal'].includes(t.phase);
  if (!browse) return;
  const teams = active();
  const listOf = r => t.moves[teams[r]?.uid] || [];
  const move = (dr, dc) => {
    e.preventDefault();
    if (!teams.length) return;
    if (dr) { cursor.row = (cursor.row + dr + teams.length) % teams.length; cursor.col = Math.min(cursor.col, Math.max(0, listOf(cursor.row).length - 1)); }
    if (dc) { const n = listOf(cursor.row).length; if (n) cursor.col = (cursor.col + dc + n) % n; }
    cursor.uid = null;
    renderAll();
  };
  if (e.key === 'ArrowUp') return move(-1, 0);
  if (e.key === 'ArrowDown') return move(1, 0);
  if (e.key === 'ArrowLeft') return move(0, -1);
  if (e.key === 'ArrowRight') return move(0, 1);
  // značky platí vždy pro řešení pod kurzorem (při odhalování na něj kurzor skočí sám)
  const x = curCand(t);
  if (!x?.e.ok) return;
  if (e.key === ' ') { e.preventDefault(); setFlag(t, x.e.key, cycleFlag(t.flags[x.e.key], t)); }
  else if (e.key === 'Escape') { e.preventDefault(); setFlag(t, x.e.key, 'warn', true); }
  else if (e.key === 'Delete') { e.preventDefault(); setFlag(t, x.e.key, 'no', true); }
});

/* ================= Start ================= */

async function startConsole() {
  await window.scrabbleLoad();
  myUid = await ScrabNet.ready();
  if (!state) state = freshState(null);
  state.settings = { ...DEFAULTS, ...state.settings };
  if (!state.code || !(await ScrabNet.exists(state.code))) {
    // nová hra, nebo živá data zmizela (smazaná místnost) – nový kód, hra pokračuje
    state.code = await ScrabNet.create();
  }
  save();
  render();
  connect();
  lastMeta = ''; publish();
  setInterval(() => {
    const t = cur();
    countdownSounds(t);
    if (state.phase === 'game' && t?.phase === 'think' && t.paused == null && now() >= t.endsAt) closeThink(t);
    const app = document.getElementById('app');
    if (app) tick(app);
  }, 200);
  setInterval(renderHeaderStatus, 1500);
}

if (IS_PROJECTION) startProjection();
else startConsole();
